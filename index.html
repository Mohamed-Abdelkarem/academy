<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <title>الأكاديمية — ألعاب البرمجة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Cairo:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <script src="assets/js/boot-lang.js"></script>
  <style>
    .hero { text-align: center; padding: 32px 16px 8px; }
    .hero p { margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .activity { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; transition: transform 0.15s; }
    .activity:hover { transform: translateY(-3px); }
    .activity .icon { font-size: 3rem; }
    .activity.soon { opacity: 0.55; pointer-events: none; }
    .tag { align-self: flex-start; background: var(--mint); color: var(--green); border-radius: 999px; padding: 2px 12px; font-weight: 700; font-size: 0.85rem; }
    footer { text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <header class="site-header">
    <span class="brand" data-i18n="home">🏠 الأكاديمية</span>
    <span class="header-actions">
      <button id="lang-btn" class="btn btn-ghost" type="button">English</button>
      <button id="code-btn" class="btn btn-ghost" type="button" data-i18n="haveCode">🔑 عندي كود</button>
    </span>
  </header>

  <section class="hero">
    <h1 data-i18n="hero">يلا نبرمج! 🚀</h1>
    <p class="muted" data-i18n="heroNote">اختار اللعبة اللي المدرس قالك عليها</p>
  </section>

  <section class="grid">
    <a class="card activity" href="activities/turtle/">
      <span class="icon">🐢</span>
      <h2 data-i18n="turtleTitle">سُلحفى الرسّام</h2>
      <span class="muted" data-i18n="turtleText">برمج سُلحفى بالأسهم عشان يرسم ويوصل للهدف</span>
      <span class="tag" data-i18n="turtleTag">حصة 1</span>
    </a>

    <a class="card activity" href="activities/maze/">
      <span class="icon">🐼</span>
      <h2 data-i18n="mazeTitle">متاهة الباندا</h2>
      <span class="muted" data-i18n="mazeText">برمج الباندا بالبلوكات عشان يوصل للعلم</span>
      <span class="tag" data-i18n="mazeTag">حصة 3 و 4</span>
    </a>
 </section>

  <footer>
    <button id="reset-btn" class="btn btn-ghost muted" type="button" data-i18n="clear">مسح التقدم من الجهاز ده</button>
  </footer>

  <script type="module">
    import { askForCode, showMessage } from './assets/js/core/ui.js';
    import { clearAll } from './assets/js/core/storage.js';
    import { pick, applyStrings, wireLangButton } from './assets/js/core/i18n.js';
    const STRINGS = {
      ar: {
        pageTitle: 'الأكاديمية — ألعاب البرمجة', home: '🏠 الأكاديمية', haveCode: '🔑 عندي كود',
        hero: 'يلا نبرمج! 🚀', heroNote: 'اختار اللعبة اللي المدرس قالك عليها',
        mazeTitle: 'متاهة الباندا', mazeText: 'برمج الباندا بالبلوكات عشان يوصل للعلم', mazeTag: 'حصة 3 و 4',
        turtleTitle: 'سُلحفى الرسّام', turtleText: 'برمج سُلحفى بالأسهم عشان يرسم ويوصل للهدف', turtleTag: 'حصة 1', soon: 'قريب', clear: 'مسح التقدم من الجهاز ده',
        unlocked: 'اتفتح!', clearQ: 'تمسح كل التقدم والأكواد من الجهاز ده؟', yes: 'امسح', no: 'لأ',
      },
      en: {
        pageTitle: 'Academy — Coding Games', home: '🏠 Academy', haveCode: '🔑 I have a code',
        hero: "Let's code! 🚀", heroNote: 'Pick the game your teacher told you about',
        mazeTitle: 'Panda Maze', mazeText: 'Program the panda with blocks to reach the flag', mazeTag: 'Classes 3 & 4',
        turtleTitle: 'Turtle Artist', turtleText: 'Program Sulhafa with arrows to draw and reach the goal', turtleTag: 'Class 1', soon: 'Coming soon', clear: 'Clear progress on this device',
        unlocked: 'Unlocked!', clearQ: 'Clear all progress and codes on this device?', yes: 'Clear', no: 'No',
      },
    };
    const T = pick(STRINGS);
    applyStrings(STRINGS);
    wireLangButton(document.getElementById('lang-btn'));
    document.getElementById('code-btn').addEventListener('click', async () => {
      const entry = await askForCode();
      if (entry) await showMessage({ icon: '🎉', title: T.unlocked, text: pick(entry.label) });
    });
    document.getElementById('reset-btn').addEventListener('click', async () => {
      const ok = await showMessage({
        icon: '🧹',
        title: T.clearQ,
        buttons: [{ label: T.yes, value: true, kind: 'accent' }, { label: T.no, value: false }],
      });
      if (ok) { clearAll(); location.reload(); }
    });
  </script>
</body>
</html>
