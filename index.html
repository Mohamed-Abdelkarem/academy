<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <title>الأكاديمية — ألعاب البرمجة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Cairo:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .hero { text-align: center; padding: 32px 16px 8px; }
    .hero p { margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .activity { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; transition: transform 0.15s; }
    .activity:hover { transform: translateY(-3px); }
    .activity .icon { font-size: 3rem; }
    .activity.soon { opacity: 0.55; pointer-events: none; }
    .tag { align-self: flex-start; background: var(--mint); color: var(--green); border-radius: 999px; padding: 2px 12px; font-weight: 700; font-size: 0.85rem; }
    footer { text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <header class="site-header">
    <span class="brand">🏠 الأكاديمية</span>
    <a href="#" id="code-btn" class="btn btn-ghost">🔑 عندي كود</a>
  </header>

  <section class="hero">
    <h1>يلا نبرمج! 🚀</h1>
    <p class="muted">اختار اللعبة اللي المدرس قالك عليها</p>
  </section>

  <section class="grid">
    <a class="card activity" href="activities/maze/">
      <span class="icon">🐼</span>
      <h2>متاهة الباندا</h2>
      <span class="muted">برمج الباندا بالبلوكات عشان يوصل للعلم</span>
      <span class="tag">حصة 3 و 4</span>
    </a>
    <div class="card activity soon">
      <span class="icon">🐢</span>
      <h2>سُلحفى الرسّام</h2>
      <span class="muted">قريب</span>
    </div>
  </section>

  <footer>
    <button id="reset-btn" class="btn btn-ghost muted" type="button">مسح التقدم من الجهاز ده</button>
  </footer>

  <script type="module">
    import { askForCode, showMessage } from './assets/js/core/ui.js';
    import { clearAll } from './assets/js/core/storage.js';
    document.getElementById('code-btn').addEventListener('click', async (e) => {
      e.preventDefault();
      const entry = await askForCode();
      if (entry) await showMessage({ icon: '🎉', title: 'اتفتح!', text: entry.label });
    });
    document.getElementById('reset-btn').addEventListener('click', async () => {
      const ok = await showMessage({
        icon: '🧹',
        title: 'تمسح كل التقدم والأكواد من الجهاز ده؟',
        buttons: [{ label: 'امسح', value: true, kind: 'accent' }, { label: 'لأ', value: false }],
      });
      if (ok) { clearAll(); location.reload(); }
    });
  </script>
</body>
</html>
